contract_version: 1.1.0
release_stage: GA
product_versions:
  rhoai: ${RHOAI_VERSION}
  opendatahub: ${OPENDATAHUB_VERSION}
  dashboard: ${DASHBOARD_VERSION}
  observability: ${OBSERVABILITY_VERSION}
  serving_repository: ${SERVING_REPOSITORY}
  serving_image: ${SERVING_IMAGE}
  gpu_exporter_image: ${GPU_EXPORTER_IMAGE}
  maas_image: ${MAAS_IMAGE}
default_time_range: {}
pipeline_health:
  marker:
    correlation_prefix: rhoai-observability
    identity_fields: [run_id, namespace, workload, pod, emission_window]
    signals: [metrics, traces, logs]
  defaults:
    propagation_timeout_seconds: 240
    query_window_seconds: 240
    http_timeout_seconds: 30
    polling_interval_seconds: 5
  records:
    - id: model-metrics-pipeline
      release_stage: GA
      signal: metrics
      stage: query
      marker: namespace-workload-pod-window
      source_query:
        protocol: prometheus
        route_key: cluster-thanos
        path: /api/v1/query
        method: GET
        selector: existing-model-series
      backend_query:
        protocol: prometheus
        route_key: cluster-thanos
        path: /api/v1/query
        method: GET
      required_labels: [namespace]
      required_attributes: []
      required_edges: []
      expected_http_status: [200]
      expected_authorization: admin-and-namespace-scoped
      minimum_results: 1
      empty_result_valid: false
      rollout_state: skipped
      activation_release: GA
      reason: Independent ingestion and backend evidence is not activated in the first pass.
      next_activation_step: Establish source, scrape, store, and scoped-route evidence for the selected workload.
    - id: model-traces-pipeline
      release_stage: GA
      signal: traces
      stage: user-retrieval
      marker: namespace-workload-pod-window
      source_query:
        protocol: otlp
        discovery: in-cluster
      backend_query:
        protocol: tempo
        discovery: in-cluster
        search_path: /api/search
        trace_path: /api/traces/{traceID}
        method: GET
      required_labels: []
      required_attributes: [service.name]
      required_edges: []
      expected_http_status: [200]
      expected_authorization: admin-and-namespace-scoped
      minimum_results: 1
      empty_result_valid: false
      rollout_state: skipped
      activation_release: GA
      reason: The selected model workload has no reviewed trace-emission contract for the first pass.
      next_activation_step: Prove a supported trace-producing workload and approve its Tempo attributes.
    - id: model-logs-pipeline
      release_stage: GA
      signal: logs
      stage: query
      marker: namespace-workload-pod-window
      source_query:
        protocol: kubernetes-logs
        discovery: in-cluster
      backend_query:
        protocol: loki
        discovery: in-cluster
        path: /loki/api/v1/query_range
        method: GET
        tenant: application
      required_labels: [namespace, pod]
      required_attributes: []
      required_edges: []
      expected_http_status: [200]
      expected_authorization: admin-and-namespace-scoped
      minimum_results: 1
      empty_result_valid: false
      rollout_state: skipped
      activation_release: GA
      reason: Loki ingestion and the selected workload log marker are not established in the first pass.
      next_activation_step: Establish the application tenant, collector path, and namespace-scoped log evidence.
    - id: model-correlation-pipeline
      release_stage: GA
      signal: correlation
      stage: user-retrieval
      marker: namespace-workload-pod-window
      source_query:
        protocol: korrel8r
        discovery: in-cluster
      backend_query:
        protocol: korrel8r
        discovery: in-cluster
        domains_path: /api/v1alpha1/domains
        objects_path: /api/v1alpha1/objects
        graph_path: /api/v1alpha1/graphs/goals
        method: GET
        max_depth: 3
      required_labels: []
      required_attributes: []
      required_edges: [metric, trace, log]
      expected_http_status: [200]
      expected_authorization: admin-and-namespace-scoped
      minimum_results: 1
      empty_result_valid: false
      rollout_state: skipped
      activation_release: GA
      reason: Correlation is not activated until the enabled signal contracts are established.
      next_activation_step: Activate only the edges backed by proven metrics, trace, and log contracts.
    - id: maas-observe-promql
      release_stage: GA
      signal: metrics
      stage: query
      marker: limitador-scrape-series
      source_query:
        protocol: prometheus
        fixture: existing-maas-limitador
      backend_query:
        protocol: observe-promql
        discovery: release-selected
        methods: [GET, POST]
      required_labels: []
      required_attributes: []
      required_edges: []
      expected_http_status: [200]
      expected_authorization: configured-maas-persona
      minimum_results: 1
      empty_result_valid: false
      rollout_state: skipped
      activation_release: GA
      reason: The supported Observe route and ExtProc deployment mode are not supplied for first-pass activation.
      next_activation_step: Establish the owner-reviewed Observe route and exercise it through the existing MaaS fixtures.
    - id: nemo-guardrails-tempo-upgrade
      release_stage: GA
      signal: traces
      stage: user-retrieval
      marker: release-n-baseline
      source_query:
        protocol: guardrails-inference
        fixture: tests/ai_safety/nemo_guardrails
      backend_query:
        protocol: tempo
        discovery: in-cluster
        search_path: /api/search
        trace_path: /api/traces/{traceID}
        method: GET
      required_labels: []
      required_attributes: [service.name]
      required_edges: []
      expected_http_status: [200]
      expected_authorization: cluster-admin
      minimum_results: 1
      empty_result_valid: false
      rollout_state: skipped
      activation_release: GA
      reason: Release N pre/post upgrade orchestration and an accepted trace baseline are out of scope.
      next_activation_step: Establish a report-only Release N baseline before any Release N+1 gate activation.
