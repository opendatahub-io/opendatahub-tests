name: Upgrade utils kind tests

on:
  pull_request:
    paths:
      - utilities/upgrade_utils.py
      - ci/upgrade_utils_tests/**
      - .github/workflows/upgrade-utils-kind.yml

jobs:
  upgrade-utils-kind:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Sync dependencies
        run: uv sync

      - name: Install kind
        run: |
          curl -sSLo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster --name upgrade-utils --kubeconfig "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Run upgrade-utils behavior-matrix tests
        run: uv run pytest ci/upgrade_utils_tests -v -o addopts="" -o testpaths= -p no:cacheprovider
