name: Sync CODEOWNERS to Contributors Team

on:
  push:
    branches: [main]
    paths:
      - ".github/CODEOWNERS"

permissions:
  contents: read

jobs:
  sync-codeowners-team:
    runs-on: ubuntu-latest

    concurrency:
      group: codeowners-team-sync-${{ github.event.after }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Sync added CODEOWNERS and report removals
        env:
          GITHUB_TOKEN: ${{ secrets.RHODS_CI_BOT_PAT }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: uv run python .github/workflows/scripts/sync_codeowners_team.py
